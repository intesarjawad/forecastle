    <script id="puzzle-startup">
      {
        const route = location.hash || "#/";
        const archived = /^#\/p\/(\d{4}-\d{2}-\d{2})$/.exec(route);
        const now = new Date();
        const today = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
        const id = archived ? archived[1] : route === "#/" ? today : null;
        const instant = id ? Date.parse(`${id}T00:00:00Z`) : NaN;
        if (id && Number.isFinite(instant) && new Date(instant).toISOString().slice(0, 10) === id) {
          const url = new URL(`./puzzles/${id}/puzzle.json`, location.href).href;
          window.forecastleInitialPuzzle = {
            url,
            response: fetch(url, { priority: "high" })
              .then(async (response) => new Response(await response.arrayBuffer(), {
                status: response.status,
                statusText: response.statusText,
                headers: response.headers,
              }))
              .catch(() => Response.error()),
          };
        }
      }
    </script>
    <noscript><style>#app { min-block-size: 0; } #startup-loading { display: none; }</style></noscript>
    <title>Forecastle</title>
  </head>
  <body>
    <main id="app" class="lesson-page" aria-label="Forecastle">
      <header class="masthead"><h1 class="wordmark">Forecastle</h1></header>
      <p id="startup-loading" role="status">Loading…</p>
    </main>
    <noscript><p class="noscript">Forecastle needs JavaScript to draw. Turn on JavaScript for this site, then reload.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
