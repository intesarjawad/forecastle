name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: [daily, live]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

concurrency: pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: main
      - run: npm ci
      - run: npm run build -w site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - uses: actions/deploy-pages@v5
        id: deployment

  cold-start:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: BASE_URL=${{ needs.deploy.outputs.page_url }} npx playwright test tests/e2e/cold-start.spec.ts --project=mobile-chromium
      - name: Worker health
        if: ${{ !cancelled() }}
        run: scripts/worker_health.sh
