name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv build
      - run: uv publish --trusted-publishing always
