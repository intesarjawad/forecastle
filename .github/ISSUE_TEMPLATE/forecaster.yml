name: New forecaster proposal
description: Propose a forecasting model or baseline.
body:
  - type: input
    id: model
    attributes:
      label: Model identifier
      description: Include a link to the model or implementation.
    validations:
      required: true
  - type: textarea
    id: licence
    attributes:
      label: Licence and evidence
      description: Link to the model's reuse terms.
    validations:
      required: true
  - type: textarea
    id: runtime
    attributes:
      label: CPU runtime
      description: Include the hardware, input size and measurement method.
    validations:
      required: true
