name: Bug report
description: Report a problem with a puzzle or the game.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and steps to reproduce
      description: Include what happened and what you expected.
    validations:
      required: true
  - type: input
    id: puzzle
    attributes:
      label: Puzzle number or date
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, operating system and browser
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Attach a screenshot if it helps explain the problem. Remove private information.
